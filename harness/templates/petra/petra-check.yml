name: PETRA collaboration
on:
  pull_request:
permissions:
  contents: read
jobs:
  collaboration:
    name: PETRA check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify package and collaboration records
        env:
          GITHUB_HEAD_REF: ${{ github.head_ref }}
          PETRA_BASE: ${{ github.base_ref }}
        run: |
          sh .petra/bin/petra verify
          sh .petra/bin/petra check --base "origin/$PETRA_BASE"
