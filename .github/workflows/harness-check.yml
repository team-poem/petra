name: harness-check
on:
  pull_request:
  workflow_dispatch:
  push:
    branches: [main]
jobs:
  hooks:
    name: 훅·루프 검증
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sh tests/hooks.sh
      - run: sh tests/loop.sh
      - run: sh tests/sobaya.sh
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - uses: actions/checkout@v4
        with:
          repository: team-poem/sobaya
          ref: d06384544e81cd373d81e2a940ab336868e04854
          path: .sobaya-test-source
      - name: 구형 worktree 연결과 실제 설치기 검증
        shell: bash
        env:
          SOBAYA_TEST_SOURCE: ${{ github.workspace }}/.sobaya-test-source
        run: bash tests/sobaya-legacy-worktree.sh all
      - name: 공개 rc.1 검증 자산 준비
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/sobaya-rc1-assets"
          for asset in install-runtime.sh sobaya-1.0.0-rc.1.json sobaya-1.0.0-rc.1.tar.gz; do
            curl --fail --location --retry 3 \
              "https://github.com/team-poem/sobaya/releases/download/v1.0.0-rc.1/$asset" \
              --output "$RUNNER_TEMP/sobaya-rc1-assets/$asset"
          done
      - name: Linux flock 검증 환경 확인
        shell: bash
        run: |
          test "$(uname -s)" = Linux
          command -v flock
          if command -v shlock; then
            echo 'Linux 검증은 shlock이 없는 환경에서 flock 분기를 실행해야 합니다.' >&2
            exit 1
          fi
          echo '설치형 잠금 검증 분기: flock'
      - name: 설치형 연결과 공개 런타임 검증
        shell: bash
        env:
          SOBAYA_TEST_ASSETS: ${{ runner.temp }}/sobaya-rc1-assets
          SOBAYA_TEST_SOURCE: ${{ github.workspace }}/.sobaya-test-source
        # 테스트가 고정 해시를 확인한 뒤에만 설치기를 실행한다. 모델 호출은 fixture 대역이다.
        run: bash tests/sobaya-installed.sh all
      - name: 혼합 연결 차단과 팀 pin sync 안내 검증
        shell: bash
        env:
          SOBAYA_TEST_ASSETS: ${{ runner.temp }}/sobaya-rc1-assets
          SOBAYA_TEST_SOURCE: ${{ github.workspace }}/.sobaya-test-source
        run: bash tests/sobaya-mixed-mode.sh all
  petra:
    name: PETRA 내부 실험실 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    permissions: { contents: read }
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - name: 실험실 재사용·초기화와 두 clone 협업 검증
        env: { PETRA_LAB_TEST_NAME: ci }
        run: sh tests/petra-lab.sh
      - name: PETRA 소비자용 공개 Sobaya 자산 준비
        shell: bash
        run: |
          mkdir -p "$RUNNER_TEMP/petra-sobaya-assets"
          for asset in install-runtime.sh sobaya-1.0.0-rc.1.json sobaya-1.0.0-rc.1.tar.gz; do
            curl --fail --location --retry 3 \
              "https://github.com/team-poem/sobaya/releases/download/v1.0.0-rc.1/$asset" \
              --output "$RUNNER_TEMP/petra-sobaya-assets/$asset"
          done
      - name: 새 PETRA 설치본의 Sobaya 연결·개발 루프 검증
        shell: bash
        env:
          SOBAYA_TEST_ASSETS: ${{ runner.temp }}/petra-sobaya-assets
        # 세 자산의 고정 해시를 검사한다. 모델만 고정 worker로 대체한다.
        run: node --test tests/petra-sobaya.test.mjs
      - name: 실행 결과·진단 로그 보관
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: petra-lab-${{ matrix.os }}
          path: |
            .petra-lab/ci/runs/test.*/result.json
            .petra-lab/ci/runs/test.*/test.log
            .petra-lab/ci/runs/test.*/install.log
            .petra-lab/ci/runs/test.*/fixture/*.out
            .petra-lab/ci/runs/test.*/fixture/target.json
          include-hidden-files: true
          retention-days: 7
          if-no-files-found: warn
  collab:
    name: 협업 규칙 검사
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - run: git fetch origin "${{ github.base_ref }}"
      - run: sh scripts/collab.sh check --base "origin/${{ github.base_ref }}"
        env: { GITHUB_HEAD_REF: "${{ github.head_ref }}" }
  prune:
    name: claim 정리 (main)
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions: { contents: write, pull-requests: write }
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - env: { GH_TOKEN: "${{ secrets.GITHUB_TOKEN }}" }
        run: |
          git config user.name harness-bot && git config user.email harness-bot@users.noreply.github.com
          sh scripts/collab.sh prune
          git diff --cached --quiet && exit 0
          git commit -m "chore(collab): prune claims"
          # main 이 보호돼 있으면 직접 push 가 막힌다 → PR 을 열고 auto-merge 로 넘긴다
          if ! COLLAB_ALLOW_PROTECTED_PUSH=1 git push 2>/dev/null; then
            # main 이 보호돼 있으면 PR 로. 브랜치는 하나를 재사용한다 (매번 새로 만들면 원격에 쌓인다)
            b="chore/collab-prune"
            git switch -c "$b" 2>/dev/null || git switch "$b"
            git push -q -f -u origin "$b"
            n="$(gh pr list --head "$b" --state open --json number --jq '.[0].number // empty')"
            if [ -n "$n" ]; then echo "기존 PR #$n 갱신"; else
              gh pr create --title "chore(collab): prune claims" --body "머지된 브랜치의 claim 정리 (CI 자동). 승인하면 auto-merge 됩니다." && gh pr merge --auto --squash "$b" || true
            fi
          fi
